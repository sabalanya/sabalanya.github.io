<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{% feed_meta %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% if page.math %}
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
{% endif %}
</head>
<body>

<main>
  {% unless page.url == '/' %}
  <nav class="topnav">
    <a href="{{ '/' | relative_url }}">← {{ site.title }}</a>
    <span><a href="{{ '/blog/' | relative_url }}">Blog</a><span class="sep">·</span><a href="{{ '/feed.xml' | relative_url }}">RSS</a></span>
  </nav>
  {% endunless %}

  {{ content }}

  <footer>
    <span>© <span id="year"></span> {{ site.title }}</span>
    <button id="theme" type="button" aria-label="Toggle light/dark theme">◐ theme</button>
  </footer>
</main>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // theme toggle (remembers choice if storage is available)
  (function () {
    const root = document.documentElement;
    try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch (e) {}
    document.getElementById('theme').addEventListener('click', () => {
      const isDark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: light)').matches;
      root.dataset.theme = isDark ? 'light' : 'dark';
      try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
    });
  })();
</script>
</body>
</html>
